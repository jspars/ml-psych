<!doctype html>
<html lang="en">
	<head>
		<title>Lawson Psychotherapy</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Dr. Monica Lawson, PsyD — individual and couples therapy for adults. PSYPACT-authorized telehealth across participating states."
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />

		<!--
			Preload the body font only. It renders above the fold on every page.
			Display fonts are left to load naturally so they don't compete for
			bandwidth on first paint.
		-->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-400.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>

		<!--
			Theme bootstrap. Runs before first paint so the correct theme is
			applied with no flash of the wrong one. Kept inline and dependency-free
			on purpose — it must execute before any stylesheet is parsed.

			Order of precedence: stored preference > system preference > light.
		-->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {
					// localStorage unavailable (private mode, blocked storage).
					// Fall through to the light default.
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
